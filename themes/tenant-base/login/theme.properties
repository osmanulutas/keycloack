# Tum tenant temalarinin ortak atasi.
# Duzeni (split panel) ve form tasarimini burasi belirler; tenant temalari
# sadece renk/logo/gorsel/metin degistirir. Bu temayi bir realm'e DOGRUDAN atamayin.
parent=keycloak.v2
import=common/keycloak

# keycloak.v2 darkMode=true ile geliyor ve isletim sistemi koyu temadaysa karti
# siyaha ceviriyor; marka paleti bozuluyor. Tasarim tek bir acik sema uzerine
# kurulu oldugu icin kapatiyoruz.
darkMode=false

# css/styles.css -> keycloak.v2'den miras alinir, sonra bizimki ezer.
styles=css/styles.css css/tenant-base.css
